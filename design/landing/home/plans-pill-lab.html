<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plans pill lab — separator and month pill</title>
<!-- A preview sheet only (2026-09-16). It loads the live Home stylesheets and the live card markup;
     each arm is a .armNN block whose overrides live in this file. index.html and page.css are not
     edited by it. Arm 00 is the page as it stands. Click a card to pick it, as on the page. -->
<link rel="stylesheet" href="../cb8/grounds.css">
<link rel="stylesheet" href="../cb8/style.css">
<link rel="stylesheet" href="page.css">
<style>
body{margin:0;background:#0A1440}
.lab-head{position:sticky;top:0;z-index:30;padding:14px 26px;background:rgba(7,14,36,.92);color:#fff;
  font:600 16px/1.3 Inter,system-ui,sans-serif;border-bottom:1px solid rgba(255,255,255,.12)}
.arm{padding:0}
.arm .block{border-radius:0;padding:40px var(--content-gutter) 56px}
.arm-name{position:relative;z-index:2;max-width:1144px;margin:0 auto 34px;color:#fff;font:600 15px/1.4 Inter,system-ui,sans-serif}
.arm-name b{display:inline-block;min-width:34px;margin-right:10px;padding:3px 8px;border-radius:8px;background:#fff;color:#0A1440;text-align:center}
.arm-name span{color:rgba(255,255,255,.62);font-weight:500}
.arm .plans-grid{position:relative;z-index:1;max-width:1144px;margin:0 auto}

/* 01 · the rule under the plate goes; the gap stays */
.arm01 .plan-list,.arm02 .plan-list,.arm03 .plan-list,.arm04 .plan-list{margin-top:20px;padding-top:0;border-top:0}

/* 02 · the month as a filled chip in the plate's own glass, no outline */
.arm02 .duration,.arm04 .duration{border:0;height:32px;padding:0 14px;
  background:linear-gradient(150deg,var(--pane-hi),var(--pane-lo));box-shadow:inset 0 1px 0 var(--pane-rim)}

/* 03 · the month as quiet words beside the name */
.arm03 .plan-head{gap:12px}
.arm03 .duration{margin-left:0;height:auto;padding:0;border:0;color:rgba(255,255,255,.6)}
.arm03 .duration::before{content:'·';margin-right:12px}

/* 04 · 02, and the top row back in the card's one white, so the share is the loud figure */
.arm04 .plan-col .equiv span{color:inherit}
</style>
</head>
<body>
<div class="lab-head">Plans pill lab — the separator under the pill, and the month pill above</div>
<div id="arms"></div>
<script>
const ARMS = [
  ['00', 'Current', 'as the page stands'],
  ['01', 'No separator', 'the rule under the pill removed, its space kept'],
  ['02', 'No separator + filled month chip', 'recommended: one kind of pill in the card'],
  ['03', 'No separator + month as text', 'the capsule dropped, the term beside the name'],
  ['04', '02 + quiet top row', 'monthly line and saving in the card white, the share stays in tier ink'],
];
const tick = '<svg class="plan-tick" viewBox="0 0 20 20" aria-hidden="true"><path d="m4.5 10.5 3.6 3.6L15.5 6.7"/></svg>';
const list = `<ul class="plan-list"><li>${tick}Pre Entry Alerts</li><li>${tick}Live XAUUSD Signals</li><li>${tick}Scalp Levels</li></ul>`;
const card = (arm, tier, name, term, price, equiv, second, rate, flag, checked) =>
  `<div class="tile plan-col" data-tier="${tier}">${flag ? `<span class="plan-flag">${flag}</span>` : ''}
    <input class="plan-pick" type="radio" name="plan-${arm}" value="${tier}" autocomplete="off"${checked ? ' checked' : ''}>
    <div class="plan-head"><img class="plan-badge" src="../cb8/img/plans/badge-${tier}.png" alt="" width="54" height="54"><h3>${name}</h3><span class="duration">${term}</span></div>
    <div class="price">${price}</div>
    <div class="plan-pill"><div class="equiv"><span>${equiv}</span>${second}</div><div class="plan-rate"><span>Cashback and Referral</span><b>${rate}</b></div></div>
    ${list}</div>`;
document.getElementById('arms').innerHTML = ARMS.map(([n, title, note]) => `
<section class="screen-blue screen-dark glass on-dark arm arm${n}">
  <div class="block">
    <div class="rayfield k k04" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="arm-name"><b>${n}</b>${title} <span>— ${note}</span></div>
    <div class="plans-grid" role="radiogroup">
      ${card(n, 'silver', 'Silver', '1 month', '$200', '$200 / month', '<span>Billed monthly</span>', '15%', '', false)}
      ${card(n, 'gold', 'Gold', '3 months', '$499', '≈ $166 / month', '<span class="plan-save">Save $101</span>', '20%', 'Most popular', true)}
      ${card(n, 'diamond', 'Diamond', '12 months', '$1,699', '≈ $142 / month', '<span class="plan-save">Save $701</span>', '30%', 'Best value', false)}
    </div>
  </div>
</section>`).join('');
// self-check: no native select on screen, and every arm drew three cards
const fails = [];
if (document.querySelector('select')) fails.push('a native select is on screen');
document.querySelectorAll('.arm').forEach((a) => { if (a.querySelectorAll('.plan-col').length !== 3) fails.push(`${a.className} has no three cards`); });
console.log(fails.length ? `LAB FAIL ${fails.join('; ')}` : `LAB OK ${ARMS.length} arms`);
</script>
</body>
</html>
