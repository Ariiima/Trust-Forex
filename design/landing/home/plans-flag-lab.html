<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plans flag lab — the two tags in the card's head</title>
<!-- A preview sheet only (2026-09-17). It loads the live Home stylesheets and the live card markup;
     each arm is a .armNN column whose overrides live in this file. index.html and page.css are not
     edited by it. Arm 00 is the page as it stands. The four arms stand side by side, each holding the
     only two cards that carry a tag, so the pills can be compared across the row at one glance.
     Click a card to pick it, as on the page.
     Arm 02 is the one that shipped, a step smaller than it is drawn here (founder, 2026-09-17). -->
<link rel="stylesheet" href="../cb8/grounds.css">
<link rel="stylesheet" href="../cb8/style.css">
<link rel="stylesheet" href="page.css">
<style>
body{margin:0;background:#0A1440}
.lab-head{position:sticky;top:0;z-index:30;padding:14px 26px;background:rgba(7,14,36,.92);color:#fff;
  font:600 16px/1.3 Inter,system-ui,sans-serif;border-bottom:1px solid rgba(255,255,255,.12)}
.lab-row{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:34px 26px 60px}
.arm{position:relative;border-radius:22px;overflow:hidden}
.arm .block{display:flex;flex-direction:column;gap:16px;padding:22px 18px 26px;border-radius:22px}
.arm-name{color:#fff;font:600 14px/1.45 Inter,system-ui,sans-serif}
.arm-name b{display:inline-block;min-width:30px;margin-right:8px;padding:2px 7px;border-radius:7px;background:#fff;color:#0A1440;text-align:center}
.arm-name span{display:block;margin-top:4px;color:rgba(255,255,255,.62);font-weight:500;font-size:13px}

/* 01 · bigger and bolder only — the pill's own type, nothing added */
.arm01 .plan-flag{height:27px;padding:0 13px;font-size:12px;font-weight:800;letter-spacing:.09em}
/* 02 · 01, and a ring of the tier's own ink round the pill, with a small lift under it */
.arm02 .plan-flag{height:27px;padding:0 13px;font-size:12px;font-weight:800;letter-spacing:.09em;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--label) 20%,transparent),0 6px 14px -8px rgba(0,0,0,.8)}
/* 03 · 02, and the flat fill becomes white falling into the tier ink, lit along its top edge */
.arm03 .plan-flag{height:27px;padding:0 13px;font-size:12px;font-weight:800;letter-spacing:.09em;
  background:linear-gradient(150deg,#fff,color-mix(in srgb,var(--label) 70%,#fff));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 0 0 3px color-mix(in srgb,var(--label) 18%,transparent)}
</style>
</head>
<body>
<div class="lab-head">Plans flag lab — Most popular and Best value, four treatments side by side</div>
<div class="lab-row" id="arms"></div>
<script>
const ARMS = [
  ['00', 'Current', 'as the page stands: 23px, flat tier ink'],
  ['01', 'Bigger and bolder', '27px, 12px type at 800, wider tracking'],
  ['02', '01 + tier ring', 'a 3px ring in the tier ink, and a lift shadow'],
  ['03', '02 + lit fill', 'white falling into the tier ink, top edge lit'],
];
const tick = '<svg class="plan-tick" viewBox="0 0 20 20" aria-hidden="true"><path d="m4.5 10.5 3.6 3.6L15.5 6.7"/></svg>';
const list = `<ul class="plan-list"><li>${tick}Pre Entry Alerts</li><li>${tick}Live XAUUSD Signals</li><li>${tick}Scalp Levels</li></ul>`;
const card = (arm, tier, name, term, price, equiv, second, rate, flag, checked) =>
  `<div class="tile plan-col" data-tier="${tier}">
    <input class="plan-pick" type="radio" name="plan-${arm}" value="${tier}" autocomplete="off"${checked ? ' checked' : ''}>
    <div class="plan-head"><img class="plan-badge" src="../cb8/img/plans/badge-${tier}.png" alt="" width="54" height="54"><h3>${name}</h3><span class="plan-flag">${flag}</span></div>
    <div class="price-line"><span class="price">${price}</span><span class="price-term">/ ${term}</span></div>
    <div class="plan-pill"><div class="equiv"><span>${equiv}</span>${second}</div><div class="plan-rate"><span>Cashback and Referral</span><b>${rate}</b></div></div>
    ${list}</div>`;
document.getElementById('arms').innerHTML = ARMS.map(([n, title, note]) => `
<section class="screen-blue screen-dark glass on-dark arm arm${n}">
  <div class="block" role="radiogroup">
  <div class="arm-name"><b>${n}</b>${title}<span>${note}</span></div>
  ${card(n, 'gold', 'Gold', '3 months', '$499', '≈ $166 / month', '<span class="plan-save">Save $101</span>', '20%', 'Most popular', true)}
  ${card(n, 'diamond', 'Diamond', '12 months', '$1,699', '≈ $142 / month', '<span class="plan-save">Save $701</span>', '30%', 'Best value', false)}
  </div>
</section>`).join('');
// self-check: no native select on screen, and every arm drew its two tagged cards
const fails = [];
if (document.querySelector('select')) fails.push('a native select is on screen');
document.querySelectorAll('.arm').forEach((a) => {
  if (a.querySelectorAll('.plan-col').length !== 2) fails.push(`${a.className} has no two cards`);
  if (a.querySelectorAll('.plan-flag').length !== 2) fails.push(`${a.className} has no two flags`);
});
console.log(fails.length ? `LAB FAIL ${fails.join('; ')}` : `LAB OK ${ARMS.length} arms`);
</script>
</body>
</html>
