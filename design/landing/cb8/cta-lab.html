<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CTA lab — Activate Cashback</title>
<!-- A preview sheet only. It loads the real cb8 stylesheets and overrides nothing in them:
     every variant is a .vNN class defined in this file, applied to a copy of the button.
     index.html, base.css, style.css and grounds.css are untouched. -->
<link rel="stylesheet" href="grounds.css">
<link rel="stylesheet" href="style.css">
<style>
/* ---------- the sheet itself ---------- */
body{background:#0A1026;color:#fff;font:400 15px/1.5 var(--sans);padding:0 0 80px}
.lab-head{position:sticky;top:0;z-index:20;padding:18px 28px;background:rgba(10,16,38,.86);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.12);
  display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.lab-head h1{font-size:17px;font-weight:600;margin:0 auto 0 0;letter-spacing:.2px}
.lab-head .set{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lab-head label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.lab-head button{padding:6px 11px;border-radius:8px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.06);color:#fff;font-size:13px;line-height:1}
.lab-head button[aria-pressed="true"]{background:#fff;color:#0A1026;border-color:#fff}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:22px;padding:26px 28px}
.card{position:relative;border-radius:20px;overflow:hidden;isolation:isolate;
  border:1px solid rgba(255,255,255,.12);min-height:240px;display:flex;flex-direction:column}
.card .rayfield{position:absolute;inset:0;z-index:0}
.card.mirror .rayfield{transform:scaleX(-1)}      /* #final mirrors the hero's ground */
.card-body{position:relative;z-index:3;flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;text-align:center;padding:34px 26px 30px}
.card-body p{margin:0;max-width:30ch;font-size:14px;line-height:1.5;color:rgba(255,255,255,.74)}
.tag{position:absolute;z-index:4;top:12px;left:12px;display:flex;gap:8px;align-items:baseline;
  padding:5px 10px;border-radius:8px;background:rgba(4,8,26,.55);border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tag b{font-size:12px;font-weight:600;letter-spacing:.04em}
.tag span{font-size:11px;color:rgba(255,255,255,.6)}
.note{position:relative;z-index:3;padding:9px 14px;font-size:12px;line-height:1.45;
  color:rgba(255,255,255,.66);background:rgba(4,8,26,.42);border-top:1px solid rgba(255,255,255,.10)}
.note em{font-style:normal;color:#FFC300}

/* ---------- the variants ----------
   Each rule is scoped .on-dark .btn-solid.vNN (0,3,0) so it outranks style.css's
   .on-dark .btn-solid (0,2,0) without !important. v01 has no rule: it is the live original. */

/* 02 · Solid white — base.css's own on-dark default, before style.css frosted it */
.on-dark .btn-solid.v02{background:#fff;color:var(--navy);border-color:#fff;backdrop-filter:none;-webkit-backdrop-filter:none;
  box-shadow:0 10px 26px -12px rgba(var(--rgb-shadow),.7)}
.on-dark .btn-solid.v02:hover{background:var(--p-50);border-color:var(--p-50);color:var(--navy)}

/* 03 · Royal solid — the brand blue, one step up from the ground */
.on-dark .btn-solid.v03{background:var(--p-900);color:#fff;border-color:rgba(255,255,255,.26);backdrop-filter:none;-webkit-backdrop-filter:none;
  box-shadow:0 14px 34px -14px rgba(var(--rgb-shadow),.8),inset 0 1px 0 rgba(255,255,255,.34)}
.on-dark .btn-solid.v03:hover{background:var(--p-700);border-color:rgba(255,255,255,.44)}

/* 04 · Deep navy — one step down instead: the button sinks into the field */
.on-dark .btn-solid.v04{background:var(--p-deep);color:#fff;border-color:rgba(var(--rgb-200),.42);backdrop-filter:none;-webkit-backdrop-filter:none;
  box-shadow:0 16px 36px -16px rgba(var(--rgb-shadow),.9),inset 0 1px 0 rgba(255,255,255,.18)}
.on-dark .btn-solid.v04:hover{background:var(--p-pressed);border-color:rgba(var(--rgb-200),.7)}

/* 05 · Heavy frost — the original recipe, twice the milk */
.on-dark .btn-solid.v05{background:rgba(255,255,255,.30);color:#fff;border-color:rgba(255,255,255,.58);
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 16px 40px -14px rgba(var(--rgb-shadow),.7),inset 0 1px 0 rgba(255,255,255,.85),inset 0 -2px 3px rgba(var(--rgb-shadow),.18)}
.on-dark .btn-solid.v05:hover{background:rgba(255,255,255,.44);border-color:#fff}

/* 06 · Ghost frost — the same glass, nearly empty */
.on-dark .btn-solid.v06{background:rgba(255,255,255,.07);color:#fff;border-color:rgba(255,255,255,.24);
  backdrop-filter:blur(8px) saturate(140%);-webkit-backdrop-filter:blur(8px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34)}
.on-dark .btn-solid.v06:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.5)}

/* 07 · Pale gradient — white falling into the palest step of the ramp */
.on-dark .btn-solid.v07{background:linear-gradient(180deg,#fff,var(--p-100));color:var(--navy);border-color:rgba(255,255,255,.9);
  backdrop-filter:none;-webkit-backdrop-filter:none;
  box-shadow:0 14px 32px -14px rgba(var(--rgb-shadow),.75),inset 0 1px 0 #fff}
.on-dark .btn-solid.v07:hover{background:linear-gradient(180deg,#fff,var(--p-50));color:var(--accent-deep)}

/* 08 · Royal gradient — the ramp's middle falling to its darkest */
.on-dark .btn-solid.v08{background:linear-gradient(180deg,var(--p-700),var(--p-950));color:#fff;border-color:rgba(255,255,255,.3);
  backdrop-filter:none;-webkit-backdrop-filter:none;
  box-shadow:0 16px 36px -14px rgba(var(--rgb-shadow),.85),inset 0 1px 0 rgba(255,255,255,.4)}
.on-dark .btn-solid.v08:hover{background:linear-gradient(180deg,var(--p-600),var(--p-900));border-color:rgba(255,255,255,.5)}

/* 09 · Outline — no fill at all, the ground reads straight through */
.on-dark .btn-solid.v09{background:transparent;color:#fff;border-color:rgba(255,255,255,.62);border-width:1.5px;
  backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
.on-dark .btn-solid.v09:hover{background:#fff;color:var(--navy);border-color:#fff}

/* 10 · Halo — solid white with the ground's own light bleeding out of it */
.on-dark .btn-solid.v10{background:#fff;color:var(--navy);border-color:#fff;backdrop-filter:none;-webkit-backdrop-filter:none;
  box-shadow:0 0 0 6px rgba(255,255,255,.10),0 0 0 16px rgba(255,255,255,.05),0 20px 48px -14px rgba(var(--rgb-200),.6)}
.on-dark .btn-solid.v10:hover{box-shadow:0 0 0 7px rgba(255,255,255,.16),0 0 0 20px rgba(255,255,255,.07),0 22px 54px -12px rgba(var(--rgb-100),.7);background:#fff;color:var(--accent-deep)}

/* 11 · Liquid bevel — glass with a lit top edge and a shaded bottom, the pill turned convex */
.on-dark .btn-solid.v11{background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.10) 46%,rgba(255,255,255,.20));
  color:#fff;border-color:rgba(255,255,255,.44);
  backdrop-filter:blur(14px) saturate(170%);-webkit-backdrop-filter:blur(14px) saturate(170%);
  box-shadow:0 14px 34px -14px rgba(var(--rgb-shadow),.7),inset 0 2px 0 rgba(255,255,255,.9),
    inset 0 -3px 6px rgba(var(--rgb-shadow),.3),inset 0 0 24px rgba(255,255,255,.10)}
.on-dark .btn-solid.v11:hover{background:linear-gradient(180deg,rgba(255,255,255,.46),rgba(255,255,255,.18) 46%,rgba(255,255,255,.3));border-color:rgba(255,255,255,.72)}

/* 12 · Amber — the brand's warning yellow used as a pure attention colour */
.on-dark .btn-solid.v12{background:var(--warning);color:#1A1200;border-color:var(--warning);backdrop-filter:none;-webkit-backdrop-filter:none;
  box-shadow:0 16px 38px -16px rgba(255,195,0,.55),inset 0 1px 0 rgba(255,255,255,.6)}
.on-dark .btn-solid.v12:hover{background:#FFD33F;border-color:#FFD33F;color:#1A1200}

/* 13 · Mint — the brand's success green, same test */
.on-dark .btn-solid.v13{background:var(--success);color:#06301C;border-color:var(--success);backdrop-filter:none;-webkit-backdrop-filter:none;
  box-shadow:0 16px 38px -16px rgba(72,212,138,.5),inset 0 1px 0 rgba(255,255,255,.55)}
.on-dark .btn-solid.v13:hover{background:#5FE09B;border-color:#5FE09B;color:#06301C}

/* 14 · Chip — white pill, the arrow riding in a royal disc */
.on-dark .btn-solid.v14{background:#fff;color:var(--navy);border-color:#fff;padding-right:8px;
  backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 12px 30px -14px rgba(var(--rgb-shadow),.7)}
.on-dark .btn-solid.v14 .ext{width:1em;height:1em;padding:.42em;box-sizing:content-box;border-radius:50%;
  background:var(--p-900);color:#fff}
.on-dark .btn-solid.v14:hover{background:var(--p-50);border-color:var(--p-50);color:var(--navy)}
.on-dark .btn-solid.v14:hover .ext{background:var(--p-700)}

/* 15 · Raised paper — no rim, only a long shadow holding it off the field */
.on-dark .btn-solid.v15{background:#fff;color:var(--navy);border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;
  box-shadow:0 26px 50px -20px rgba(var(--rgb-shadow),.95),0 6px 14px -6px rgba(var(--rgb-shadow),.6)}
.on-dark .btn-solid.v15:hover{background:#fff;color:var(--accent-deep);box-shadow:0 32px 60px -18px rgba(var(--rgb-shadow),1),0 8px 18px -6px rgba(var(--rgb-shadow),.7)}

/* 16 · Pressed glass — royal body under a specular top sheet and a white hairline */
.on-dark .btn-solid.v16{background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,0) 52%),var(--p-900);
  color:#fff;border-color:rgba(255,255,255,.5);backdrop-filter:none;-webkit-backdrop-filter:none;
  box-shadow:0 14px 32px -14px rgba(var(--rgb-shadow),.8),inset 0 1px 0 rgba(255,255,255,.85),inset 0 -6px 12px rgba(var(--rgb-pressed),.5)}
.on-dark .btn-solid.v16:hover{background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 52%),var(--p-800);border-color:rgba(255,255,255,.7)}

/* 17 · Dark glass — the frost inverted: shadow-tinted body, pale rim */
.on-dark .btn-solid.v17{background:rgba(var(--rgb-shadow),.46);color:#fff;border-color:rgba(var(--rgb-200),.46);
  backdrop-filter:blur(12px) saturate(150%);-webkit-backdrop-filter:blur(12px) saturate(150%);
  box-shadow:0 14px 34px -14px rgba(var(--rgb-shadow),.9),inset 0 1px 0 rgba(255,255,255,.24)}
.on-dark .btn-solid.v17:hover{background:rgba(var(--rgb-shadow),.66);border-color:rgba(var(--rgb-100),.75)}

/* 18 · Gradient rim — the fill stays glass, the border carries the ramp */
.on-dark .btn-solid.v18{color:#fff;border-color:transparent;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05)) padding-box,
             linear-gradient(120deg,#fff,rgba(255,255,255,.18) 42%,var(--p-200)) border-box;
  backdrop-filter:blur(12px) saturate(160%);-webkit-backdrop-filter:blur(12px) saturate(160%);
  box-shadow:0 14px 34px -14px rgba(var(--rgb-shadow),.7),inset 0 1px 0 rgba(255,255,255,.4)}
.on-dark .btn-solid.v18:hover{background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.12)) padding-box,
             linear-gradient(120deg,#fff,rgba(255,255,255,.4) 42%,var(--p-100)) border-box}

@media (max-width:520px){.grid{grid-template-columns:1fr;padding:18px 14px}.lab-head{padding:14px}}
</style>
</head>
<body>
<svg id="liquid-svg" width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="liquid" x="-4%" y="-8%" width="108%" height="116%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.006 0.010" numOctaves="2" seed="7" result="n"><animate attributeName="baseFrequency" dur="24s" values="0.006 0.010;0.010 0.006;0.006 0.010" repeatCount="indefinite"/></feTurbulence>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/>
</filter></svg>

<header class="lab-head">
  <h1>Activate Cashback — CTA versions</h1>
  <div class="set">
    <label>Ground</label>
    <button type="button" data-ground="k01" aria-pressed="true">01 One</button>
    <button type="button" data-ground="k03" aria-pressed="false">03 Pair</button>
    <button type="button" data-ground="k05" aria-pressed="false">05 Wash</button>
    <button type="button" data-ground="k07" aria-pressed="false">07 Bar</button>
    <button type="button" data-ground="k12" aria-pressed="false">12 Aurora</button>
    <button type="button" data-ground="k13" aria-pressed="false">13 Deep pool</button>
    <button type="button" data-ground="k15" aria-pressed="false">15 Spotlight</button>
  </div>
  <div class="set">
    <label>Mirror</label>
    <button type="button" id="mirror" aria-pressed="true">as #final</button>
  </div>
</header>

<div class="grid" id="grid"></div>

<script>
/* One card per variant. The markup inside is the live button from index.html, character for
   character, plus the variant class — so nothing here can drift from the real CTA's structure. */
var BTN = function (cls) {
  return '<a class="btn btn-solid ' + cls + '" href="#" rel="noopener">Activate Cashback ' +
    '<svg class="ext" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8 3.5 12.5 8 8 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>';
};

var VARIANTS = [
  ['v01','Original',      'Live rule from style.css. White at 16%, blur 10, saturate 160.', 'Nothing overridden — this is the shipping button, for reference.'],
  ['v02','Solid white',   'base.css default: flat #fff, navy ink, no blur.', 'Highest contrast of the set. Reads as a system button, not a glass one.'],
  ['v03','Royal solid',   'Brand blue #144CCD, white ink.', 'Blue on blue: strong shape, but the label leans on the rim to separate.'],
  ['v04','Deep navy',     'One step darker than the field, pale rim.', 'The button sinks rather than lifts. Quietest of the solids.'],
  ['v05','Heavy frost',   'White at 30%, blur 20, bright top edge.', 'The original recipe pushed hard. Costs the most GPU of the glass set.'],
  ['v06','Ghost frost',   'White at 7%, hairline rim.', 'Nearly a text link. Fine for a secondary action, thin for a primary one.'],
  ['v07','Pale gradient', 'White falling to --p-100, navy ink.', 'White that is not flat. Keeps solid-white contrast with a little depth.'],
  ['v08','Royal gradient','--p-700 falling to --p-950.', 'Reads as a physical key. The darkest edge sits close to the ground below it.'],
  ['v09','Outline',       'No fill, 1.5px white rim, fills white on hover.', 'Lightest option. On a busy ground the label fights the halo behind it.'],
  ['v10','Halo',          'Solid white inside two soft white rings.', 'Borrows the light of the ground. The rings need clear space around them.'],
  ['v11','Liquid bevel',  'Glass, lit top edge, shaded bottom, inner glow.', 'Closest to the liquid-glass language used on the panels.'],
  ['v12','Amber',         '--warning #FFC300 with near-black ink.', 'Loudest by far. <em>Brand rule says yellow means pending</em>, so this borrows a state colour.'],
  ['v13','Mint',          '--success #48D48A with deep-green ink.', 'Same caveat: <em>green is reserved for success</em> in the palette.'],
  ['v14','Chip',          'White pill, arrow in a royal disc.', 'Adds a second colour without a second button. The disc scales with the type.'],
  ['v15','Raised paper',  'White, no rim, one long shadow.', 'The shadow does the separating. It disappears on the palest part of a ground.'],
  ['v16','Pressed glass', 'Royal body under a specular top sheet.', 'Blue but glossy — the middle ground between 03 and 11.'],
  ['v17','Dark glass',    'Shadow-tinted body, pale blue rim.', 'The frost inverted. Holds up over the brightest halos better than white glass.'],
  ['v18','Gradient rim',  'Glass fill, the ramp painted into the border.', 'Two background layers — padding-box fill, border-box rim. No border colour.']
];

document.getElementById('grid').innerHTML = VARIANTS.map(function (v) {
  return '<div class="card mirror">' +
    '<div class="rayfield k k01" aria-hidden="true"><i></i><i></i><i></i><i></i></div>' +
    '<div class="tag"><b>' + v[1] + '</b><span>' + v[0] + '</span></div>' +
    '<div class="card-body on-dark"><p>' + v[2] + '</p>' + BTN(v[0]) + '</div>' +
    '<div class="note">' + v[3] + '</div></div>';
}).join('');

Array.prototype.forEach.call(document.querySelectorAll('[data-ground]'), function (b) {
  b.addEventListener('click', function () {
    Array.prototype.forEach.call(document.querySelectorAll('[data-ground]'), function (x) {
      x.setAttribute('aria-pressed', String(x === b));
    });
    Array.prototype.forEach.call(document.querySelectorAll('.card .rayfield'), function (f) {
      f.className = 'rayfield k ' + b.dataset.ground;
    });
  });
});

var mirror = document.getElementById('mirror');
mirror.addEventListener('click', function () {
  var on = mirror.getAttribute('aria-pressed') !== 'true';
  mirror.setAttribute('aria-pressed', String(on));
  Array.prototype.forEach.call(document.querySelectorAll('.card'), function (c) {
    c.classList.toggle('mirror', on);
  });
});
</script>
</body>
</html>
