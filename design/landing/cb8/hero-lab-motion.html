<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero ground lab — motion</title>
<!-- The moving half of hero-lab.html. Same rules: it loads the real cb8 stylesheets, defines
     every candidate locally, and changes nothing the site ships.

     Every candidate sits in the live markup — <div class="rayfield k dNN"> — so it keeps the
     plain #0C2E7B field, the faint grid style.css puts on ::before, and the shared vignette on
     ::after. What varies is what moves on top of that.

     Three rules every candidate here has to pass, and the toolbar tests all three:
       · REDUCE — main.js already sets html.reduce from ?reduce=1 or the media query, and
         design/review/shoot.mjs captures with reducedMotion:'reduce'. Anything still moving
         in that state makes every sweep.sh diff drift. Press Reduce: motion must stop on a
         deterministic frame, not wherever it happened to be.
       · WEIGHT — the hero is the LCP element. Each card prints what it costs.
       · FALLBACK — no WebGL, no autoplay, a blocked CDN: the CSS ground underneath is what
         remains, so a dead candidate degrades to today's hero rather than to a black box. -->
<link rel="stylesheet" href="grounds.css">
<link rel="stylesheet" href="style.css">
<style>
/* ---------- the sheet itself ---------- */
body{background:#0A1026;color:#fff;font:400 15px/1.5 var(--sans);padding:0 0 80px}
.lab-head{position:sticky;top:0;z-index:20;padding:14px 26px;background:rgba(10,16,38,.86);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.12);
  display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.lab-head h1{font-size:16px;font-weight:600;margin:0 auto 0 0;letter-spacing:.2px}
.lab-head h1 a{color:#89A5E6;font-weight:400;font-size:13px;margin-left:10px}
.lab-head .set{display:flex;gap:6px;align-items:center}
.lab-head label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.lab-head button,.lab-head select{padding:6px 11px;border-radius:8px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:13px;line-height:1.2}
.lab-head button[aria-pressed="true"]{background:#fff;color:#0A1026;border-color:#fff}
.lab-head select option{background:#0A1026}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(460px,1fr));gap:20px;padding:22px 26px}
.card{position:relative;border-radius:20px;overflow:hidden;isolation:isolate;
  border:1px solid rgba(255,255,255,.12);aspect-ratio:16/10;display:flex;flex-direction:column}
.card .rayfield{position:absolute;inset:0;z-index:0}
.card-body{position:relative;z-index:4;flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;text-align:center;padding:8% 8% 7%}
.card-body h2{margin:0;font-size:clamp(20px,2.5vw,30px);line-height:1.14;letter-spacing:-.02em;font-weight:640;
  text-wrap:balance;max-width:18ch}
.card-body p{margin:0;max-width:40ch;font-size:13px;line-height:1.5;color:rgba(255,255,255,.76)}
.card-body .btn{margin-top:4px}
.tag{position:absolute;z-index:5;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;
  padding:5px 10px;border-radius:8px;background:rgba(4,8,26,.55);border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tag b{font-size:12px;font-weight:600;letter-spacing:.04em}
.tag span{font-size:11px;color:rgba(255,255,255,.6)}
.tag .kb{margin-left:auto;font-size:11px;color:#A1B7EB;white-space:nowrap}
.tag em{font-style:normal;color:#FFC300;font-size:11px}

body.band .card::after{content:'';position:absolute;z-index:6;left:0;right:0;top:30%;height:40%;pointer-events:none;
  border-top:1px dashed rgba(255,195,0,.5);border-bottom:1px dashed rgba(255,195,0,.5);background:rgba(255,195,0,.05)}
body.mirror .card .rayfield{transform:scaleX(-1)}
body.full .grid{display:block;padding:0}
body.full .card{aspect-ratio:auto;min-height:100dvh;border-radius:0;border:0;border-bottom:1px solid rgba(255,255,255,.14)}
body.full .card-body h2{font-size:clamp(34px,4.4vw,58px);max-width:22ch}
body.full .card-body p{font-size:16px;max-width:52ch}

/* media grounds sit in the same stack as the <i> lights, under the vignette */
.rayfield.k > canvas,.rayfield.k > video,.rayfield.k > img.media,.rayfield.k > .lottie{
  display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;border:0}
.rayfield.k > .note-fallback{position:absolute;z-index:3;left:50%;bottom:14px;transform:translateX(-50%);
  font-size:11px;color:#FFC300;background:rgba(4,8,26,.6);padding:4px 9px;border-radius:6px}

/* Reduce: nothing in a ground may keep animating. Candidates that need a specific frozen
   frame do it in JS; this is the blanket rule for everything driven by CSS. */
html.reduce .rayfield.k i,html.reduce .rayfield.k::before,html.reduce .rayfield.k > *{animation:none!important}

/* ============================================================================
   A · NO NEW DEPENDENCY — CSS and the SVG filter the pages already carry
   ============================================================================ */

/* d01 · Liquid — the hero's halo pushed through #liquid, the feTurbulence displacement
   filter every page already defines and already pauses under reduced motion. Zero bytes. */
.d01 .warp{position:absolute;inset:-10%;z-index:0;filter:url(#liquid)}
.d01 .warp b{position:absolute;display:block;border-radius:50%;filter:blur(var(--bl,90px));background:var(--halo)}
.d01 .warp b:nth-child(1){left:-6%;top:-22%;width:58%;height:92%;--core:.8}
.d01 .warp b:nth-child(2){right:-14%;bottom:-34%;width:52%;height:86%;--bl:110px;background:var(--shadow)}
.d01 .warp b:nth-child(3){left:36%;top:-30%;width:34%;height:56%;--bl:70px;--core:.5}

/* d02 · Aurora — one broad ribbon of light along the top, drifting and breathing. */
.d02 i:nth-child(1){display:block;left:-25%;top:-10%;width:150%;height:32%;transform:rotate(-9deg);--bl:70px;
  background:linear-gradient(90deg,transparent,rgba(var(--rgb-400),.6) 28%,rgba(255,255,255,.72) 50%,rgba(var(--rgb-900),.7) 76%,transparent);
  animation:auroraA 28s ease-in-out infinite alternate}
.d02 i:nth-child(2){display:block;left:-15%;top:2%;width:130%;height:14%;transform:rotate(-9deg);--bl:40px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.34) 46%,transparent);
  animation:auroraB 19s ease-in-out infinite alternate}
.d02 i:nth-child(3){display:block;left:-10%;bottom:-44%;width:120%;height:72%;--bl:130px;background:var(--shadow)}
@keyframes auroraA{to{transform:rotate(-4deg) translate3d(-6%,3%,0) scaleY(1.25)}}
@keyframes auroraB{to{transform:rotate(-13deg) translate3d(8%,-2%,0)}}

/* d03 · Radar — one conic pass over range rings. The only ground that says "still running". */
.rayfield.d03::before{background:repeating-radial-gradient(circle at 50% 6%,transparent 0 82px,rgba(var(--rgb-100),.22) 82px 84px);
  -webkit-mask-image:radial-gradient(100% 100% at 50% 6%,#000 10%,transparent 80%);
  mask-image:radial-gradient(100% 100% at 50% 6%,#000 10%,transparent 80%)}
.d03 i:nth-child(1){display:block;left:-40%;top:-104%;width:180%;height:230%;--bl:18px;border-radius:50%;z-index:3;
  background:conic-gradient(from 0deg,transparent 0 58%,rgba(var(--rgb-200),.30) 84%,rgba(255,255,255,.52) 96%,transparent 100%);
  animation:spin 16s linear infinite}
.d03 i:nth-child(2){display:block;left:24%;top:-40%;width:52%;height:60%;--bl:80px;--core:.7}
.d03 i:nth-child(3){display:block;left:-14%;bottom:-42%;width:130%;height:64%;--bl:130px;background:var(--shadow)}
html.reduce .d03 i:nth-child(1){transform:rotate(126deg)}
@keyframes spin{to{transform:rotate(360deg)}}

/* d04 · Pulse — rings leaving a source at the foot, one every three seconds. Referral's
   subject as a loop: one share, then the next. */
.d04 i{display:block;left:50%;bottom:-6%;width:30%;height:52%;--bl:0;background:none;
  border:1px solid rgba(var(--rgb-100),.5);transform-origin:50% 100%;
  animation:pulse 9s cubic-bezier(.2,.6,.2,1) infinite;opacity:0}
.d04 i:nth-child(1){margin-left:-15%;animation-delay:0s}
.d04 i:nth-child(2){margin-left:-15%;animation-delay:3s}
.d04 i:nth-child(3){margin-left:-15%;animation-delay:6s}
.d04 i:nth-child(4){margin-left:0;left:12%;bottom:auto;top:-30%;width:46%;height:64%;--bl:90px;
  border:0;background:var(--halo);--core:.6;opacity:1;animation:none}
@keyframes pulse{0%{transform:scale(.15);opacity:0}12%{opacity:.9}100%{transform:scale(4.2);opacity:0}}
html.reduce .d04 i{animation:none;opacity:.5}
html.reduce .d04 i:nth-child(1){transform:scale(1.1)}
html.reduce .d04 i:nth-child(2){transform:scale(2.2)}
html.reduce .d04 i:nth-child(3){transform:scale(3.3)}

/* d05 · Shimmer — a specular band crosses the field every nine seconds and is gone. The
   least intrusive way to make a still ground feel awake. */
.d05 i:nth-child(1){display:block;left:-8%;top:-30%;width:62%;height:86%;--bl:100px;--core:.8}
.d05 i:nth-child(2){display:block;right:-16%;bottom:-38%;width:56%;height:84%;--bl:110px;background:var(--shadow)}
.d05 i:nth-child(3){display:block;top:-60%;left:-40%;width:26%;height:220%;--bl:26px;border-radius:0;z-index:3;
  transform:rotate(18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.30),transparent);
  animation:shimmer 9s cubic-bezier(.5,0,.3,1) infinite}
@keyframes shimmer{0%,55%{transform:translateX(0) rotate(18deg)}100%{transform:translateX(560%) rotate(18deg)}}
html.reduce .d05 i:nth-child(3){transform:translateX(190%) rotate(18deg)}

/* d06 · Parallax — the lights follow the pointer, a fraction of its travel. Desktop only by
   nature: a touch screen has no hover, so it reads as d01 there. */
.d06 i{transition:transform .5s cubic-bezier(.16,1,.3,1)}
.d06 i:nth-child(1){display:block;left:-10%;top:-28%;width:56%;height:88%;--bl:100px;--core:.8;
  transform:translate3d(calc(var(--mx,0) * 34px),calc(var(--my,0) * 26px),0)}
.d06 i:nth-child(2){display:block;right:-16%;bottom:-36%;width:52%;height:86%;--bl:120px;background:var(--shadow);
  transform:translate3d(calc(var(--mx,0) * -22px),calc(var(--my,0) * -16px),0)}
.d06 i:nth-child(3){display:block;left:34%;top:-34%;width:34%;height:58%;--bl:60px;--core:.55;
  transform:translate3d(calc(var(--mx,0) * 68px),calc(var(--my,0) * 44px),0)}

/* d07 · Scroll — no JS and no timer: the ground drifts on the view-timeline base.css already
   declares, so it only moves while the hero is leaving. */
.d07{animation:groundRise linear both;animation-timeline:view();animation-range:entry 0% exit 100%}
.d07 i:nth-child(1){display:block;left:-8%;top:-30%;width:60%;height:90%;--bl:100px;--core:.8}
.d07 i:nth-child(2){display:block;right:-16%;bottom:-38%;width:54%;height:86%;--bl:120px;background:var(--shadow)}
.d07 i:nth-child(3){display:block;left:30%;top:-26%;width:40%;height:60%;--bl:80px;background:var(--royal)}
@keyframes groundRise{from{transform:scale(1.14) translateY(4%)}to{transform:scale(1) translateY(-6%)}}

/* ============================================================================
   B · CANVAS, HAND-ROLLED — no library, a few dozen lines each, in hero-lab-motion.js
   ============================================================================ */
.d08 i:nth-child(1){display:block;left:-10%;top:-30%;width:52%;height:74%;--bl:100px;--core:.6}
.d08 i:nth-child(2){display:block;right:-18%;bottom:-40%;width:58%;height:84%;--bl:120px;background:var(--shadow)}
.d09 i:nth-child(1){display:block;left:-12%;top:-34%;width:66%;height:70%;--bl:100px;--core:.7}
.d09 i:nth-child(2){display:block;right:-16%;bottom:-42%;width:58%;height:80%;--bl:120px;background:var(--shadow)}
.d10 > canvas{-webkit-mask-image:linear-gradient(180deg,transparent 44%,#000 74%);mask-image:linear-gradient(180deg,transparent 44%,#000 74%)}
.d10 i:nth-child(1){display:block;left:-14%;top:-38%;width:62%;height:72%;--bl:100px;--core:.76}
.d10 i:nth-child(2){display:block;right:-18%;top:-28%;width:46%;height:60%;--bl:110px;background:var(--royal)}
.d11 i:nth-child(1){display:block;left:20%;top:-40%;width:60%;height:76%;--bl:90px;--core:.78}
.d11 i:nth-child(2){display:block;left:-16%;bottom:-38%;width:62%;height:82%;--bl:120px;background:var(--shadow)}

/* ============================================================================
   C · WEBGL
   ============================================================================ */
.d12 > canvas,.d13 > canvas{z-index:1}
/* the library wants its colours off the canvas element */
.d13 > canvas{--gradient-color-1:#0C2E7B;--gradient-color-2:#144CCD;--gradient-color-3:#002D94;--gradient-color-4:#A1B7EB}

/* ============================================================================
   D · AUTHORED MEDIA — a drawn loop, a film, a frame sequence, a photograph
   ============================================================================ */
/* d14 · Lottie — lab-halos.json on the player the site already ships. The shapes are hard
   ellipses; the blur is one CSS filter over the whole player, which is far cheaper than
   asking Lottie to blur four layers. */
.d14 > .lottie{filter:blur(90px);opacity:.85;transform:scale(1.15)}

/* d15 · Film — shared/lane/obj-crack.mp4, already in the repo and used nowhere. Luminosity
   blend keeps the render in the brand blue instead of dropping a grey box on it. */
.d15 > video{mix-blend-mode:luminosity;opacity:.55}
.d15 i:nth-child(1){display:block;left:-14%;top:-34%;width:58%;height:82%;--bl:110px;--core:.55}

/* d16 · Frames — the same shot as 121 webp stills, drawn to a canvas at the scroll position.
   This is the scrubbing hero: the picture is wherever the reader is, not wherever time is. */
.d16 > canvas{mix-blend-mode:luminosity;opacity:.42}
.d16 i:nth-child(1){display:block;inset:0;border-radius:0;--bl:0;z-index:2;
  background:radial-gradient(72% 78% at 50% 48%,rgba(var(--rgb-shadow),.30) 0%,rgba(var(--rgb-shadow),.72) 100%)}

/* d17 · Photograph — shared/lane/ground-sky.png under the field, on a slow push-in. A real
   image behind the blue instead of a generated one. */
.d17 > img.media{mix-blend-mode:soft-light;opacity:.9;animation:kenburns 40s ease-in-out infinite alternate}
.d17 i:nth-child(1){display:block;left:-10%;top:-30%;width:56%;height:84%;--bl:110px;--core:.6}
@keyframes kenburns{from{transform:scale(1.04) translate3d(0,0,0)}to{transform:scale(1.18) translate3d(-2%,-2%,0)}}
</style>
</head>
<body>

<!-- the site's own liquid filter, lifted verbatim from every page's <head> so d01 is exactly
     what would ship, animation and all -->
<svg id="liquid-svg" width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="liquid" x="-4%" y="-8%" width="108%" height="116%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.006 0.010" numOctaves="2" seed="7" result="n"><animate attributeName="baseFrequency" dur="24s" values="0.006 0.010;0.010 0.006;0.006 0.010" repeatCount="indefinite"/></feTurbulence>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/>
</filter></svg>

<header class="lab-head">
  <h1>Hero ground lab — motion <a href="hero-lab.html">← the still set</a></h1>
  <div class="set"><label for="copy">Copy</label>
    <select id="copy">
      <option value="home">Home</option>
      <option value="results">Results</option>
      <option value="brokers">Brokers</option>
      <option value="referral">Referral</option>
      <option value="partnership">Partnership</option>
      <option value="about">About</option>
    </select>
  </div>
  <div class="set">
    <button id="t-full" type="button" aria-pressed="false">Full bleed</button>
    <button id="t-band" type="button" aria-pressed="false">Headline band</button>
    <button id="t-mirror" type="button" aria-pressed="false">Mirror (#final)</button>
    <button id="t-reduce" type="button" aria-pressed="false">Reduce</button>
  </div>
</header>

<div class="grid" id="grid"></div>

<script src="ico/lottie_light.min.js"></script>
<script src="hero-lab-motion.js?v=1"></script>
</body>
</html>
