<!doctype html>
<html lang="en" class="pending">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculator lab — the estimate panel</title>
<!-- A preview sheet only. It loads the real cb8 stylesheets and changes nothing in them.
     index.html, base.css, style.css and grounds.css are untouched.

     This panel now ships. index.html and style.css carry it as of 2026-09-12; the sheet stays as the
     place to look at it on its own, without scrolling the whole page to reach it.

     Where this stands (founder, 2026-09-12): the panel is settled. The arrangement is v3 of the
     first round — two steps with a rule between them — and the type is t4 of the second, where the
     steps read as small white headings and everything under them is sentence case and quiet. The
     step numbers are gone as well; two captions read top to bottom already say which comes first.

     The selection is already on the real page: all four metals lit, the pick inside a white rim.
     .vsel below is only what the sheet needs to draw the same thing outside #calculator, and it is
     not part of what moves to the site.

     Two rules, kept apart on purpose. .v3 is the arrangement — padding, gaps, the rule between the
     steps. .t4 is type and nothing else: no box, no spacing, no ground. Moving this to the site is
     those two blocks with .calcv rewritten back to #calculator, and nothing else changes. The
     self-check at the foot fails if a .t4 rule ever sets a property that is not type.

     The panel's treatment lives under #calculator in style.css, and this sheet is not that page. So
     it fetches style.css at load, rewrites #calculator to .calcv, and injects the result — the card
     is styled by the shipped rules themselves and can never go stale.

     The three fields keep the browser's own select. main.js swaps those for the page's picker on the
     real page; the picker is not what this sheet is deciding, and loading main.js here would start
     the whole page's machinery.

     Serve it: python3 _qa/serve.py 5311 then open localhost:5311/cb8/calc-lab.html -->
<link rel="stylesheet" href="grounds.css">
<link rel="stylesheet" href="style.css">
<style id="ship"></style>
<style>
/* ---------- the sheet itself ---------- */
html.pending body{visibility:hidden}
body{background:#E9EEF8;color:var(--navy);font:400 15px/1.5 var(--sans);padding:0 0 90px;margin:0}
.lab-head{position:sticky;top:0;z-index:30;padding:16px 26px;background:rgba(233,238,248,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(var(--rgb-shadow),.12);
  display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.lab-head h1{font-size:17px;font-weight:600;margin:0 auto 0 0;letter-spacing:.2px}
.lab-head .set{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lab-head .set b{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.lab-head button{padding:6px 11px;border-radius:8px;border:1px solid rgba(var(--rgb-shadow),.2);
  background:#fff;color:var(--navy);font:600 13px/1 var(--sans);cursor:pointer}
.lab-head button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}

/* one column, and the window stays wide: the rail halves and the fields stack under 1024px, and a
   card narrower than the window must not be shown the phone's layout */
.grid{display:grid;grid-template-columns:1fr;gap:26px;padding:24px 26px;max-width:700px;margin:0 auto}
.case{background:#fff;border-radius:22px;border:1px solid rgba(var(--rgb-shadow),.1);overflow:hidden;
  box-shadow:0 18px 44px -32px rgba(var(--rgb-shadow),.6)}
.case > header{padding:16px 20px 13px;border-bottom:1px solid rgba(var(--rgb-shadow),.08)}
.case > header h2{margin:0 0 3px;font-size:15px;font-weight:700;letter-spacing:-.01em}
.case > header p{margin:0;font-size:13px;line-height:1.5;color:var(--body);max-width:62ch}
.case > header dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:9px 0 0;
  font-size:12px;line-height:1.45;color:var(--muted)}
.case > header dt{font-weight:600;color:var(--body);white-space:nowrap}
.case > header dd{margin:0}
/* the panel wants the paper the calculator's block gives it, and the pill straddles that edge */
.stage{padding:34px 26px 30px;background:var(--paper)}
/* the panel is judged at the width the page actually gives it: half of the 1200 wrap less the
   92 gap and the 28 gutters = 526. Any wider and the labels stop wrapping for the wrong reason. */
.calcv{display:block;width:526px;margin:0 auto}
.calcv .block{padding:0;background:none;box-shadow:none;border-radius:0;min-height:0;display:block;overflow:visible}

/* ================= the selection, from the Referral rail =================
   Already shipped in style.css under #calculator. Restated here because the sheet draws the panel
   as .calcv, and .calcv .tile would otherwise outrank the shared .rate-cell block. Values are
   style.css's own — nothing new is being proposed on this line. */
.vsel .rate-cell[aria-pressed=false][data-tier=standard]{--tint:rgba(227,125,39,.68);--tint2:rgba(147,70,4,.68);--rim:rgba(236,176,136,.46)}
.vsel .rate-cell[aria-pressed=false][data-tier=silver]{--tint:rgba(204,218,238,.24);--tint2:rgba(118,144,184,.21);--rim:rgba(228,238,250,.46)}
.vsel .rate-cell[aria-pressed=false][data-tier=gold]{--tint:rgba(218,157,38,.72);--tint2:rgba(140,90,0,.72);--rim:rgba(240,208,130,.5)}
.vsel .rate-cell[aria-pressed=false][data-tier=diamond]{--tint:rgba(138,96,224,.32);--tint2:rgba(76,48,150,.29);--rim:rgba(196,166,250,.46)}
.vsel .rate-cell[aria-pressed=false]{--streak:.32}
.vsel .rate-cell[aria-pressed=false]:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.62);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(var(--rgb-shadow),.22),0 18px 32px -20px rgba(var(--rgb-shadow),.8)}
.vsel .rate-cell[aria-pressed=true]{--streak:.42;transform:none;border-color:#fff;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:inset 0 0 0 1px #fff,inset 0 1px 0 rgba(255,255,255,.5),0 0 0 4px rgba(255,255,255,.12),0 18px 34px -18px var(--rim)}
.vsel .rate-cell[aria-pressed=true][data-tier=standard]{--tint:rgba(222,134,67,.8);--tint2:rgba(150,79,29,.8);--rim:rgba(236,176,136,.5);--label:#FFF1E6}
.vsel .rate-cell[aria-pressed=true][data-tier=silver]{--tint:rgba(204,218,238,.36);--tint2:rgba(118,144,184,.32);--rim:rgba(228,238,250,.55)}
.vsel .rate-cell[aria-pressed=true][data-tier=gold]{--tint:rgba(224,172,69,.84);--tint2:rgba(152,108,24,.84);--rim:rgba(240,208,130,.55);--label:#FFF6DF}
.vsel .rate-cell[aria-pressed=true][data-tier=diamond]{--tint:rgba(138,96,224,.5);--tint2:rgba(76,48,150,.46);--rim:rgba(196,166,250,.55)}

/* ================= .v3 — the arrangement, identical on all four cards =================
   Two steps with a rule between them: how you trade, then what your level is, then the answer on
   its own plate. Sizes and gaps only — every word's weight, size and case belongs to a .tN below. */
.v3 .panel{padding:24px 26px 26px}
.v3 .step + .step{margin-top:20px;padding-top:20px;border-top:1px solid rgba(255,255,255,.16)}
.v3 .step-cap{margin:0 0 13px}
.v3 .fields{gap:14px}
.v3 .well{padding:12px 16px 13px}
.v3 .level-row{--cell-h:88px;gap:13px}
.v3 .estimate{margin-top:22px;padding:14px 20px 14px 22px;align-items:baseline;background:rgba(var(--rgb-abyss),.3)}
.v3 .estimate small{margin-bottom:0}
.v3 .estimate strong em{margin-left:-5px}

/* ================= .t4 — the type =================
   If the panel is two questions, the two questions should look like questions. The step captions
   leave the caption tier entirely and become small white headings at 15px; everything under them
   goes sentence case and quiet, so each step reads as a heading with its answer beneath. No uppercase
   anywhere except the metals' own shares, which are figures. */
.t4 .step-cap{font:var(--weight-semi) var(--text-panel-title)/1.2 var(--sans);letter-spacing:-.015em;text-transform:none;color:#fff}
.t4 .well>label{font:var(--weight-body) var(--text-small)/var(--leading-ui) var(--sans);letter-spacing:0;text-transform:none;color:rgba(255,255,255,.58)}
.t4 .well select,.t4 .well input,.t4 .well-value{font-weight:var(--weight-label)}
.t4 .rate-cell small{font-weight:var(--weight-label)}
.t4 .rate-cell strong,.t4 .estimate strong{font-weight:var(--weight-semi)}
.t4 .estimate strong em{font-weight:var(--weight-body)}
.t4 .estimate small{font:var(--weight-body) var(--text-meta)/var(--leading-ui) var(--sans);letter-spacing:0;text-transform:none;color:rgba(255,255,255,.6)}

@media (max-width:1100px){.grid{max-width:none}}
</style>
</head>
<body>
<!-- the liquid rim filter the panel's ::before asks for; index.html carries the same node -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="liquid" x="-4%" y="-8%" width="108%" height="116%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.006 0.010" numOctaves="2" seed="7" result="n"><animate attributeName="baseFrequency" dur="24s" values="0.006 0.010;0.010 0.006;0.006 0.010" repeatCount="indefinite"/></feTurbulence>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/>
</filter></svg>

<div class="lab-head">
  <h1>Calculator lab — the estimate panel</h1>
  <div class="set" id="tierset"><b>Picked level</b></div>
</div>

<div class="grid" id="grid"></div>

<script type="module">
/* ---------- the shipped panel rules, rescoped so four of them can stand on one page ---------- */
const sheet = await fetch('style.css').then(r => r.text());
document.getElementById('ship').textContent = sheet.replace(/#calculator\b/g, '.calcv');
document.documentElement.classList.remove('pending');

const TIERS = [['standard', 'Standard', 10], ['silver', 'Silver', 15], ['gold', 'Gold', 20], ['diamond', 'Diamond', 30]];
const EXT = `<svg class="ext" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8 3.5 12.5 8 8 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const LIVE = `<span class="live" aria-hidden="true"><i></i>Live estimate</span>`;
const RAIL = TIERS.map(([t, n, r]) => `<button class="tile rate-cell level" type="button" aria-pressed="${t === 'gold'}" data-rate="${r}" data-tier="${t}"><small>${n}</small><strong>${r}%</strong></button>`).join('');
const WELLS = `<div class="field tile well"><label>Partner broker</label><select><option>GTCFX</option><option>XM</option><option>XS</option></select></div>
  <div class="field tile well"><label>Account type</label><select class="acct"><option value="1">Standard</option><option value="0.35">ECN</option></select></div>
  <div class="field tile well"><label>XAUUSD volume</label><input class="vol" type="number" min="0" max="10000000" step="1" inputmode="decimal" value="50"></div>`;
const ESTIMATE = `<div class="estimate" role="status" aria-live="polite"><small>Estimated Cashback</small><strong class="out">$170 <em>/ month</em></strong></div>`;
const RULES = `<a class="broker-rules" href="#">View rules for each broker ${EXT}</a>`;

/* v3's arrangement — two steps, a rule between them, the answer on its own plate */
const PANEL = `${LIVE}
  <div class="step"><p class="step-cap">How you trade</p><div class="fields">${WELLS}</div></div>
  <div class="step"><p class="step-cap" id="level-cap">Your Cashback level</p><div class="rate-rail level-row" role="group" aria-labelledby="level-cap">${RAIL}</div></div>
  ${ESTIMATE}${RULES}`;

const SPEC = [
  ['Step caption', '15px · 600 · sentence · white'],
  ['Field label', '12px · 400 · sentence · 58% white'],
  ['Field value', '18px · 500'],
  ['Level name', '12px · 500'],
  ['Level share', '27px · 600'],
  ['Estimate caption', '13px · 400 · sentence · 60% white'],
  ['Estimate figure', '44px · 600, "/ month" 400'],
];

document.getElementById('grid').innerHTML = `<section class="case">
  <header>
    <h2>v3 arrangement, t4 type</h2>
    <p>Two steps with a rule between them, the answer on its own plate. The step captions are small
       white headings and their numbers are gone. Nothing else on the panel is uppercase, and the
       only two things left at 700 are the level's share and the monthly figure.</p>
    <dl>${SPEC.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
  </header>
  <div class="stage"><div class="calcv vsel v3 t4"><div class="block">
    <form class="panel lit" novalidate>${PANEL}</form>
  </div></div></div>
</section>`;

/* ---------- the calculator: volume x 17 x account factor x share ---------- */
const compact = new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 });
const card = document.querySelector('.calcv');
const vol = card.querySelector('.vol'), acct = card.querySelector('.acct'), out = card.querySelector('.out');
const cells = [...card.querySelectorAll('.rate-cell')];
let rate = +cells.find(c => c.getAttribute('aria-pressed') === 'true').dataset.rate;
const price = () => {
  let v = Math.max(0, parseFloat(vol.value) || 0);
  const max = +vol.max;
  if (v > max) { v = max; vol.value = String(max); }
  const n = Math.round(v * 17 * parseFloat(acct.value) * rate / 100);
  const figure = `$${n < 1e7 ? n.toLocaleString('en-US') : compact.format(n)}`;
  out.innerHTML = `${figure} <em>/ month</em>`;
  out.classList.toggle('long', figure.length > 7);
  out.classList.remove('swap'); void out.offsetWidth; out.classList.add('swap');
};
cells.forEach(b => b.addEventListener('click', () => {
  cells.forEach(o => o.setAttribute('aria-pressed', String(o === b)));
  rate = +b.dataset.rate;
  price();
}));
[vol, acct].forEach(el => el.addEventListener('input', price));
price();

/* ---------- the head's tier buttons, so each metal can be judged in place ---------- */
const set = document.getElementById('tierset');
set.insertAdjacentHTML('beforeend', TIERS.map(([t, n]) =>
  `<button type="button" data-tier="${t}" aria-pressed="${t === 'gold'}">${n}</button>`).join(''));
set.addEventListener('click', e => {
  const b = e.target.closest('button[data-tier]');
  if (!b) return;
  set.querySelectorAll('button[data-tier]').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
  card.querySelector(`.rate-cell[data-tier="${b.dataset.tier}"]`).click();
});

/* ---------- self-check ----------
   The figure the sheet shows, the shape of the panel, and the promise that .t4 carries type only —
   that last one read back out of this page's own stylesheet, so the split survives editing. */
if (new URLSearchParams(location.search).get('check') === '1') {
  const fails = [];
  const est = (v, f, r) => Math.round(v * 17 * f * r / 100);
  if (est(50, 1, 20) !== 170) fails.push(`gold estimate ${est(50, 1, 20)} != 170`);
  if (cells.length !== 4) fails.push(`${cells.length} cells, want 4`);
  if (card.querySelectorAll('.rate-cell[aria-pressed=true]').length !== 1) fails.push('not exactly one cell picked');
  if (card.querySelectorAll('.step').length !== 2) fails.push('not two steps');
  if (card.querySelector('.step-cap i')) fails.push('a step caption still carries its number');
  if (!out.textContent.startsWith('$170')) fails.push(`estimate reads ${out.textContent.trim()}`);
  const TYPE = /^(font|line-height|letter-spacing|text-transform|color|--cell-figure)/;
  const own = [...document.styleSheets].find(s => s.ownerNode && s.ownerNode.id !== 'ship' && !s.href);
  for (const rule of own.cssRules) {
    if (!rule.selectorText || !/\.t4\b/.test(rule.selectorText)) continue;
    for (const prop of rule.style) if (!TYPE.test(prop)) fails.push(`${rule.selectorText} sets ${prop}, which is not type`);
  }
  console[fails.length ? 'error' : 'log'](fails.length ? `calc-lab: ${fails.join('; ')}` : 'calc-lab: ok');
}
</script>
</body>
</html>
